mcp_port: 15720

plugins:
  asr:
    enabled: false
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: true
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"
  localAsr:
    enabled: false
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: true
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: false
    model_dir: /models/sherpa-onnx/tts
    speaker_id: 0
    speed: 1.0

  htmsg:
    enabled: false
    namespace: ""       # auto-detect from hostname if empty
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: false
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  ocr:
    enabled: true
    provider: openai   # openai | qwen | tesseract | google
    url: ""            # API URL (empty = default endpoint)
    key: ""            # API Key
    model: ""          # model name (default: gpt-4o-mini / qwen-vl-max)
    language: "zh"     # default language hint

  obstacle:
    # All obstacle implementations expose the same evaluator-facing tool name
    # "obstacle". Enable exactly one of obstacle / obstacleRule /
    # obstacleFastDepth. For a remote API set provider to openai or qwen; local
    # keeps using plugins/obstacle.py.
    enabled: true
    provider: qwen       # openai | qwen | local
    # API base only; do not append /chat/completions. Empty selects the provider
    # default or OBSTACLE_API_BASE from the container environment.
    url: "http://172.28.4.72:32527/v1"
    # Keep this empty in a public repository. Preferred environment variables:
    # OBSTACLE_API_KEY, OPENAI_API_KEY, or DASHSCOPE_API_KEY.
    key: ""
    # Empty selects gpt-4o-mini / qwen-vl-max, or OBSTACLE_API_MODEL.
    model: "qwen3.5-27b"
    decision_distance_m: 2.0
    boundary_margin_m: 0.02
    no_obstacle_distance: 10.0
    request_timeout_seconds: 30
    request_retries: 1
    model_path: "/models/obstacle"
    # 8 GB Jetson runs 10 inference containers concurrently. Keep the
    # controllable CUDA/TensorRT budget below 450 MiB per container so CUDA
    # context overhead still fits the approximately 500-600 MiB target.
    gpu_memory_limit_mb: 384
    trt_workspace_limit_mb: 64
    use_dla: false

  obstacleRule:
    enabled: false       # CPU-only dry-run implementation
    provider: rule
    # null enables image-dependent CPU/OpenCV analysis. Set a numeric value only
    # when a deliberately constant connectivity-test result is required.
    fixed_distance_m: null
    no_obstacle_distance: 10.0
    near_distance_m: 0.5
    far_distance_m: 5.0
    # The product classifies pred_distance < 2 m as positive. Keep this
    # boundary explicit instead of deriving it indirectly from near/far values.
    decision_distance_m: 2.0
    # Lower values favor recall; higher values favor precision. Tune this on a
    # labeled validation split instead of targeting a 50% positive rate.
    positive_score_threshold: 0.62
    boundary_margin_m: 0.02
    score_threshold: 0.18
    processing_width: 320
    processing_height: 240

  obstacleFastDepth:
    # Only one obstacle implementation may be enabled because each intentionally
    # exposes the evaluator-facing tool/prefix name "obstacle".
    enabled: false
    provider: fastdepth
    # Directory cache. utils.model_downloader downloads the configured
    # obstacle_fastdepth single-file artifact here when it is missing.
    model_path: "/models/fastdepth"
    # CPU is the safe default for the strict shared-memory budget on Jetson.
    # Change to cuda or tensorrt only when the container has a GPU allocation.
    execution_provider: cpu
    cpu_threads: 1
    gpu_memory_limit_mb: 192
    trt_workspace_limit_mb: 32
    scene_mode: auto
    indoor_quantile: 0.01
    outdoor_quantile: 0.05
    min_distance: 0.05
    max_distance: 10.0
    no_obstacle_distance: 10.0
    # Evaluation: pred_distance < 2 m is positive; values at or above 2 m are
    # negative. FastDepth is NYU-indoor
    # trained, so calibrate its raw cutoff independently for each domain using
    # a labeled validation split. Start both raw cutoffs at the new 2 m product
    # boundary, then tune them from info.calibration raw quantiles instead of
    # reusing the old 1.5 m cutoffs or forcing a fixed positive/negative ratio.
    decision_distance_m: 2.0
    indoor_positive_depth_m: 2.0
    outdoor_positive_depth_m: 2.0
    boundary_margin_m: 0.02
    bias_warning_min_samples: 20
